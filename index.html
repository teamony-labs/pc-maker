<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC BUILD LAB 3D</title>
<style>
:root{
  --bg:#0b0e14; --panel:#121722; --panel2:#182031; --line:#263043;
  --text:#e6ebf2; --muted:#8d99ab; --accent:#4cc9f0; --ok:#7bf1a8;
  --danger:#ff6b6b; --warn:#ffc857;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button{font:inherit;color:inherit}
#app{display:grid;height:100vh;grid-template-columns:380px 1fr;grid-template-rows:56px 1fr;
  grid-template-areas:"head head" "side view"}
header{grid-area:head;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:#0e131c;border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.1em;white-space:nowrap}
.logo b{color:var(--accent)}
#dots{display:flex;gap:4px;flex:1;max-width:460px;min-width:120px}
.dot{flex:1;height:6px;border-radius:3px;background:#222b3a;transition:background .3s}
.dot.done{background:var(--ok)} .dot.cur{background:var(--accent)}
.pills{display:flex;gap:8px;margin-left:auto}
.pill{font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.pill strong{color:var(--text);font-variant-numeric:tabular-nums}
aside{grid-area:side;overflow:auto;padding:20px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px}
#stepNo{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
#stepTitle{margin:2px 0 0;font-size:22px;line-height:1.35}
#stepDesc{margin:0;color:#c3ccd8;line-height:1.75;font-size:14.5px}
.tip{background:#13202a;border:1px solid #1e3a48;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:#bfe9f7}
.tip::before{content:"ポイント";display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.optLabel{font-size:12px;color:var(--muted);letter-spacing:.08em}
.opt{position:relative;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:#3b4a63}
.opt.sel{border-color:var(--accent);background:#15283a}
.opt.single{cursor:default}
.opt .n{font-weight:600;font-size:15px}
.opt .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.opt.bad{opacity:.55}
.cab{display:flex;align-items:center;gap:10px}
.cab .st{margin-left:auto;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cab.done .st{border-color:var(--ok);color:var(--ok)}
.cab.done{opacity:.7}
.cab .sw{width:10px;height:34px;border-radius:3px;background:#2c3038;flex:0 0 auto}
.opt.bad::after{content:"合わない";position:absolute;right:12px;top:12px;font-size:11px;color:var(--danger);
  border:1px solid var(--danger);border-radius:999px;padding:1px 8px}
#install{margin-top:2px;background:var(--accent);color:#06222d;border:0;border-radius:10px;padding:13px;
  font-weight:700;font-size:15px;cursor:pointer;transition:filter .15s,opacity .15s}
#install:hover{filter:brightness(1.1)}
#install:disabled{opacity:.4;cursor:not-allowed}
#install.power{background:var(--ok);color:#062615}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-4px}
#spec{display:none;border:1px dashed #33405a;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;color:#aab6c6}
#spec .row{display:flex;gap:10px;padding:3px 0;border-top:1px solid #1f2838}
#spec .row:first-of-type{border-top:0}
#spec .k{flex:0 0 64px;color:var(--muted)}
#spec .v{color:var(--text);font-weight:600}
#spec .v small{display:block;font-weight:400;color:#8d99ab;font-size:11.5px;line-height:1.5}
#spec .h{font-size:11px;letter-spacing:.12em;color:var(--muted)}
#view{grid-area:view;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#16202f 0%,#0b0e14 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  max-width:min(560px,90%);padding:12px 18px;border-radius:10px;font-size:14px;line-height:1.6;
  background:#1b2433;border:1px solid var(--line);transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{border-color:var(--danger);background:#2a1418;color:#ffd6d6}
#toast.ok{border-color:var(--ok);background:#12261b;color:#d7ffe6}
#toast.warn{border-color:var(--warn);background:#2a2412;color:#fff0c8}
#tooltip{position:absolute;pointer-events:none;padding:4px 10px;border-radius:6px;font-size:12.5px;
  background:rgba(12,16,24,.92);border:1px solid var(--line);display:none;white-space:nowrap}
#glassBtn{position:absolute;right:12px;top:12px;font-size:12.5px;cursor:pointer;
  background:rgba(12,16,24,.75);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--text)}
#glassBtn:hover{border-color:#3b4a63}
#help{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);
  background:rgba(12,16,24,.7);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#boot{position:absolute;inset:0;background:#05070a;display:none;padding:40px;
  font-family:Consolas,"Courier New",monospace;color:#9effb8;font-size:15px;line-height:1.9;white-space:pre-wrap}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.55)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 32px;width:min(420px,90%);text-align:center}
.card h2{margin:0 0 6px;font-size:24px}
#fSpec{text-align:left;font-size:13px;margin-bottom:20px}
#fSpec .row{display:flex;gap:10px;padding:5px 0;border-top:1px solid #1f2838}
#fSpec .k{flex:0 0 70px;color:var(--muted)}
#fSpec .v{font-weight:600}
.stats{display:flex;justify-content:center;gap:24px;color:var(--muted);font-size:14px;margin-bottom:20px}
.stats strong{display:block;color:var(--text);font-size:20px}
.btns{display:flex;gap:10px;justify-content:center}
.btns button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 16px;cursor:pointer}
.btns button.pri{background:var(--accent);border-color:var(--accent);color:#06222d;font-weight:700}
@media (max-width:820px){
  #app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 56vh auto;grid-template-areas:"head" "view" "side"}
  header{flex-wrap:wrap;padding:10px 16px;gap:8px}
  #dots{order:3;flex-basis:100%;max-width:none}
  aside{border-right:0;border-top:1px solid var(--line);padding:16px}
  #help{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">PC BUILD <b>LAB</b> 3D</div>
    <div id="dots"></div>
    <div class="pills">
      <span class="pill">消費電力目安 <strong id="watt">0W</strong></span>
    </div>
  </header>
  <aside>
    <div>
      <div id="stepNo"></div>
      <h1 id="stepTitle"></h1>
    </div>
    <p id="stepDesc"></p>
    <div class="tip" id="stepTip"></div>
    <div id="spec"></div>
    <div class="opts" id="opts"></div>
    <button id="install">取り付ける</button>
    <div class="hint" id="hint">3D画面で光っている部品をクリックしても取り付けられます</div>
  </aside>
  <div id="view">
    <canvas id="c" tabindex="0"></canvas>
    <div id="toast"></div>
    <div id="tooltip"></div>
    <button id="glassBtn">ガラスパネルを付ける</button>
    <div id="help">ドラッグ: 回転 ／ ホイール: ズーム ／ 右ドラッグ: 移動</div>
    <div id="boot"></div>
    <div id="finish">
      <div class="card">
        <h2>完成！</h2>
        <div style="color:var(--muted);font-size:14px;margin-bottom:14px">あなたのPCは無事に起動しました</div>
        <div id="fSpec"></div>
        <div class="btns">
          <button id="look">PCを眺める</button>
          <button class="pri" id="again">もう一度組み立てる</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/RoundedBoxGeometry.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;

/* ================= renderer / scene ================= */
const canvas = $('#c'), view = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 600);
camera.position.set(40, 26, 80);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 12; controls.maxDistance = 170;
controls.maxPolarAngle = Math.PI * 0.62;

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x14181f, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(30, 60, 70); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 10, far: 200 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35); fill.position.set(-60, 10, 30); scene.add(fill);
const inner = new THREE.PointLight(0xffffff, 0.35, 70); inner.position.set(0, 6, 12); scene.add(inner);
const rgbLights = [[16, 8, 3], [-4, -7, 5], [-10, 20, 2]].map(p => {
  const l = new THREE.PointLight(0xffffff, 0, 34, 2); l.position.set(...p); scene.add(l); return l;
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x0c1017, roughness: .6, metalness: .2 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -24.95; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(220, 44, 0x1d2940, 0x131a26); grid.position.y = -24.9;
grid.material.transparent = true; grid.material.opacity = .5; scene.add(grid);

/* ================= helpers ================= */
function mat(c, r = .5, m = .2, extra = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: r, metalness: m }, extra)); }
const M = {
  body: mat(0x1c1f24, .42, .65), tray: mat(0x202329, .5, .6), inner: mat(0x1a1d22, .55, .5),
  chrome: mat(0xe6e9ee, .12, 1), metal: mat(0xc2c7cf, .28, .9), nickel: mat(0xd5d8dc, .22, .95),
  dark: mat(0x121418, .55, .3), pcbEdge: mat(0x0f1215, .6, .1), green: mat(0x18392a, .55, .1),
  slot: mat(0x24272d, .45, .1), slotW: mat(0xd5d9df, .5, .05), copper: mat(0xc7773a, .25, 1),
  gold: mat(0xd9b04a, .25, 1), alu: mat(0x9aa1ab, .32, .9), aluDark: mat(0x3a3f47, .35, .85),
  rubber: mat(0x0a0b0d, .85, 0), shroud: mat(0x2a2e35, .35, .7), backplate: mat(0x17191d, .35, .8),
  psu: mat(0x15171a, .45, .6), choke: mat(0x34373d, .5, .5), cap: mat(0x1d1f23, .3, .7),
  blade: mat(0x1c1f25, .45, .1, { transparent: true, opacity: .92, side: THREE.DoubleSide })
};
function box(w, h, d, m, x = 0, y = 0, z = 0, p) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); if (p) p.add(o); return o;
}
function rbox(w, h, d, m, x = 0, y = 0, z = 0, p, r = .15) {
  r = Math.min(r, Math.min(w, h, d) / 2 - .001);
  const geo = r > .02 ? new THREE.RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d);
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); if (p) p.add(o); return o;
}
function cyl(r, h, m, x, y, z, p, axis = 'z', seg = 24) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m);
  if (axis === 'z') o.rotation.x = Math.PI / 2; else if (axis === 'x') o.rotation.z = Math.PI / 2;
  o.position.set(x, y, z); if (p) p.add(o); return o;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function label(w, h, lines, { bg = '#0f1216', fg = '#e8ecf2', accent = null, metal = 0 } = {}, x, y, z, p) {
  const [c, g] = mkCanvas(512, Math.max(32, Math.round(512 * h / w)));
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height); }
  if (accent) { g.fillStyle = accent; g.fillRect(0, c.height * .9, c.width, c.height * .1); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const total = lines.reduce((a, l) => a + l[1], 0);
  let yy = c.height * (1 - total) / 2;
  lines.forEach(([t, s, col]) => {
    const px = c.height * s;
    g.font = `700 ${px * .8}px "Segoe UI",Arial,sans-serif`; g.fillStyle = col || fg;
    g.fillText(t, c.width / 2, yy + px / 2); yy += px;
  });
  const m = new THREE.MeshStandardMaterial({ map: toTex(c), roughness: .45, metalness: metal,
    transparent: !bg, polygonOffset: true, polygonOffsetFactor: -2 });
  const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  o.position.set(x, y, z); if (p) p.add(o); return o;
}

/* --- LEDs: emissive mesh + additive halo --- */
function ledMat() {
  const m = new THREE.MeshStandardMaterial({ color: 0x1c1f24, emissive: 0x000000, roughness: .35 });
  m.userData.led = true; return m;
}
function haloMat() {
  return new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false });
}
function ledMesh(geo, haloGeo, p, x = 0, y = 0, z = 0, base = 0x1c1f24) {
  const m = ledMat(); m.color.set(base);
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z);
  if (haloGeo) { const hm = haloMat(); const h = new THREE.Mesh(haloGeo, hm); o.add(h); o.userData.halo = hm; }
  if (p) p.add(o); return o;
}
const ledBox = (w, h, d, p, x, y, z, base) =>
  ledMesh(new THREE.BoxGeometry(w, h, d), new THREE.BoxGeometry(w + .7, h + .7, d + .7), p, x, y, z, base);

/* --- procedural textures --- */
const texCache = {};
function meshAlpha(scale) {
  const [c, g] = mkCanvas(64, 64);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#000';
  [[16, 16], [48, 16], [0, 48], [32, 48], [64, 48]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.fill(); });
  const t = toTex(c, false); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(scale[0], scale[1]); return t;
}
function meshMat(rep, color = 0x1b1e23) {
  return mat(color, .4, .7, { alphaMap: meshAlpha(rep), alphaTest: .5, side: THREE.DoubleSide });
}
function sleeveTex(len) {
  if (!texCache.sleeve) {
    const [c, g] = mkCanvas(64, 64);
    g.fillStyle = '#0f1013'; g.fillRect(0, 0, 64, 64);
    g.lineWidth = 5;
    for (let i = -64; i < 128; i += 16) {
      g.strokeStyle = '#2c3038'; g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke();
      g.strokeStyle = '#22252b'; g.beginPath(); g.moveTo(i + 64, 0); g.lineTo(i, 64); g.stroke();
    }
    texCache.sleeve = c;
  }
  const t = toTex(texCache.sleeve); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(len * 1.4, 3); return t;
}
/* --- fans --- */
const geoCache = {};
function fanFrameGeo(s, d) {
  const k = 'f' + s; if (geoCache[k]) return geoCache[k];
  const r = s * .09, h = s / 2, sh = new THREE.Shape();
  sh.moveTo(-h + r, -h); sh.lineTo(h - r, -h); sh.quadraticCurveTo(h, -h, h, -h + r);
  sh.lineTo(h, h - r); sh.quadraticCurveTo(h, h, h - r, h); sh.lineTo(-h + r, h);
  sh.quadraticCurveTo(-h, h, -h, h - r); sh.lineTo(-h, -h + r); sh.quadraticCurveTo(-h, -h, -h + r, -h);
  const hole = new THREE.Path(); hole.absarc(0, 0, s * .465, 0, Math.PI * 2, true); sh.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 2, curveSegments: 40 });
  g.translate(0, 0, -d / 2); return (geoCache[k] = g);
}
function bladeGeo(s) {
  const k = 'b' + s; if (geoCache[k]) return geoCache[k];
  const R = s * .45, r0 = s * .12, sh = new THREE.Shape();
  sh.moveTo(r0, -R * .07);
  sh.quadraticCurveTo(R * .6, -R * .3, R * .98, -R * .14);
  sh.quadraticCurveTo(R * 1.03, R * .1, R * .86, R * .26);
  sh.quadraticCurveTo(R * .5, R * .22, r0, R * .12);
  return (geoCache[k] = new THREE.ExtrudeGeometry(sh, { depth: .05, bevelEnabled: false, curveSegments: 10 }));
}
function makeFan(s, { frame = true, led = true, blades = 9 } = {}) {
  const g = new THREE.Group(), fm = mat(0x121418, .5, .2), d = s * .2;
  if (frame) {
    g.add(new THREE.Mesh(fanFrameGeo(s, d), fm));
    for (let i = 0; i < 3; i++) { const st = box(s * .45, s * .03, s * .03, fm, 0, 0, -d / 2 + .1, g); st.rotation.z = i * Math.PI * 2 / 3 + .4; st.translateX(s * .24); }
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([a, b]) => cyl(s * .03, d + .02, M.rubber, a * s * .41, b * s * .41, 0, g, 'z', 10));
  } else {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(s * .48, s * .03, 8, 48), fm); g.add(ring);
  }
  if (led) {
    const R = s * .455, tb = s * .018;
    ledMesh(new THREE.TorusGeometry(R, tb, 8, 64), new THREE.TorusGeometry(R, tb * 4, 8, 64), g, 0, 0, d * .5);
  }
  const rotor = new THREE.Group(); rotor.userData.rotor = true; g.add(rotor);
  cyl(s * .12, d * .7, fm, 0, 0, 0, rotor, 'z', 32);
  const cap = label(s * .17, s * .17, [['', .1]], { bg: '#1e222a', accent: '#4cc9f0' }, 0, 0, d * .36, rotor);
  cap.geometry = new THREE.CircleGeometry(s * .1, 32);
  for (let i = 0; i < blades; i++) {
    const piv = new THREE.Group(); piv.rotation.z = i * Math.PI * 2 / blades;
    const b = new THREE.Mesh(bladeGeo(s), M.blade); b.rotation.x = .5; piv.add(b); rotor.add(piv);
  }
  return g;
}
const named = (g, name) => { g.userData.name = name; return g; };
function shadowify(obj) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    if (m.transparent || m.blending === THREE.AdditiveBlending) return;
    o.castShadow = o.receiveShadow = true;
  });
  return obj;
}

/* ================= catalog ================= */

const tweens = [];
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function tween(dur, fn, ease = easeIO) {
  return new Promise(res => tweens.push({ s: performance.now(), dur, fn, ease, res }));
}
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], k = Math.min(1, (now - tw.s) / tw.dur);
    tw.fn(tw.ease(k));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
const DIR = new THREE.Vector3(.5, .32, 1).normalize();
function focus([x, y, z, d]) {
  const tgt = new THREE.Vector3(x, y, z), pos = tgt.clone().addScaledVector(DIR, d);

}

function tone(f, d, type = 'sine', v = .12, slide) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

  if (staging) { staging.parent.remove(staging); staging = null; }
  if (ghost) { ghost.parent.remove(ghost); ghost = null; }
}
function makeGhost(obj) {
  obj.traverse(o => { if (o.isMesh) { o.material = ghostMat; o.castShadow = o.receiveShadow = false; } });
  return obj;
}
const parentOf = (st, o) => (o && o.parent ? o.parent : st.parent)();
function setupStep() {
  clearStage();
  const st = steps[idx];
  sel = null;
  if (st.id === 'case') sel = CASES.indexOf(B.case);
  if (st.type === 'wire') {
    setupWires();
  } else if (st.type === 'power') {
    ghost = new THREE.Mesh(new THREE.TorusGeometry(1.9, .25, 8, 40), ghostMat);
    ghost.rotation.x = Math.PI / 2; ghost.position.copy(powerBtn.position); ghost.position.y += .35; caseG.add(ghost);
  }
  renderStep();
  focus(st.focus());
}
function spawn(opt) {
  const st = steps[idx];
  clearStage();
  const parent = parentOf(st, opt), base = st.base || [0, 0, 0];
  ghost = makeGhost(opt.build()); ghost.position.set(...base); parent.add(ghost);
  const w = new THREE.Group(); w.add(shadowify(opt.build()));
  w.userData.base = new THREE.Vector3(...base);
  w.userData.off = new THREE.Vector3(...(opt.offset || st.offset));
  w.position.copy(w.userData.base).add(w.userData.off);
  parent.add(w); staging = w;
}
function choose(i) {
  const st = steps[idx];
  if (busy || finished || !st.options) return;
  sel = i; sfx.pick();
  if (st.id === 'case') { setCase(st.options[i].part); focus(st.focus()); }
  else spawn(st.options[i]);
  renderStep();
}

/* ================= install ================= */
async function attempt() {
  if (busy || finished) return;
  const st = steps[idx];
  if (st.type === 'power') return powerOn();
  if (st.type === 'wire') { toast('3D画面でプラグをドラッグして、差し込み口につなごう', 'warn'); return; }
  if (st.id === 'case') { sfx.click(); toast('「' + B.case.name + '」に決めました', 'ok'); return next(); }
  if (st.type === 'cable') {
    busy = true;
    const g = buildCable(st.pts(), st.r, false); named(g, st.name);
    const tube = g.userData.tube, total = tube.geometry.index.count, seg = 12 * 6;
    tube.geometry.setDrawRange(0, 0); g.userData.end.visible = false;
    ghost.parent.remove(ghost); ghost = null;
    pc.add(g);
    await tween(1400, k => tube.geometry.setDrawRange(0, Math.floor(total * k / seg) * seg), k => k);
    g.userData.end.visible = true; installed.push(g); sfx.click();
    toast('「' + st.name + '」をつなぎました', 'ok');
    busy = false; return next();
  }
  if (sel === null) { toast('先にパーツを選んでください', 'warn'); return; }
  const opt = st.options[sel], w = staging, base = w.userData.base, off = w.userData.off;
  busy = true;
  const from = w.position.clone();
  const reason = st.check ? st.check(opt.part) : null;
  if (reason) {
    opt.bad = true;
    const near = base.clone().addScaledVector(off, .3);
    await tween(450, k => w.position.lerpVectors(from, near, k));
    sfx.err(); toast(reason, 'error');
    await tween(420, k => { w.position.copy(near); w.position.x += Math.sin(k * Math.PI * 8) * .5 * (1 - k); }, k => k);
    const back = base.clone().add(off);
    await tween(450, k => w.position.lerpVectors(near, back, k));
    sel = null; clearStage(); busy = false; renderStep();
    return;
  }
  await tween(1000, k => w.position.lerpVectors(from, base, k));
  sfx.click();
  w.traverse(o => { if (o.userData.name && !w.userData.name) w.userData.name = o.userData.name; });
  installed.push(w); staging = null;
  if (ghost) { ghost.parent.remove(ghost); ghost = null; }
  B[st.id] = opt.part;
  if (st.id === 'mb') mbW = w;
  if (st.onInstall) st.onInstall(opt.part);
  toast('「' + opt.name + '」を取り付けました', 'ok');
  busy = false; next();
}
function next() { idx++; if (idx < steps.length) setupStep(); }

/* ================= glass panel ================= */
let glassBusy = false;
async function setGlass(close) {
  if (glassBusy || glass.userData.closed === close) return;
  glassBusy = true; glass.visible = true;
  const m = glass.children[0].material, z0 = glass.position.z, z1 = close ? glass.userData.zClosed : 45;
  const o0 = close ? 0 : .16, o1 = close ? .16 : 0, tint = glass.children[1].material;
  await tween(800, k => { glass.position.z = z0 + (z1 - z0) * k; m.opacity = o0 + (o1 - o0) * k; tint.opacity = (close ? k : 1 - k) * .85; });
  glass.visible = close; glass.userData.closed = close; glassBusy = false;
  $('#glassBtn').textContent = close ? 'ガラスパネルを外す' : 'ガラスパネルを付ける';
}
$('#glassBtn').onclick = () => setGlass(!glass.userData.closed);

/* ================= power on ================= */
let rotors = [], leds = [], fanTarget = 0, fanSpeed = 0, ledLevel = 0;
async function powerOn() {
  if (busy) return; busy = true;
  if (ghost) { ghost.parent.remove(ghost); ghost = null; }
  finished = true;
  dots.lastChild.className = 'dot done';
  rotors = []; leds = [];
  pc.traverse(o => {
    if (!o.visible) return;
    if (o.userData.rotor) rotors.push(o);
    if (o.isMesh && o.material.userData && o.material.userData.led && !o.material.userData.fixed)
      leds.push({ m: o.material, h: o.userData.halo, i: leds.length });
  });
  sfx.boot(); fanTarget = 1;
  $('#install').disabled = true; $('#install').textContent = '起動中…';
  setGlass(true);
  await tween(2600, () => {});
  const boot = $('#boot'); boot.style.display = 'block'; boot.textContent = '';
  const pad = (s, n) => (s + ' ').padEnd(n, '.');
  const lines = [
    B.mb.name + ' BIOS  v1.04', '',
    pad(`CPU    : ${B.cpu.brand} ${B.cpu.model}  ${B.cpu.cores} Cores`, 50) + ' OK',
    pad(`Memory : ${B.ram.gb}GB ${B.ram.ddr}  Dual Channel`, 50) + ' OK',
    pad(`Storage: NVMe SSD ${B.m2.cap}`, 50) + ' OK',
    pad(`Video  : ${B.gpu.name}`, 50) + ' OK',
    pad(`Cooler : ${B.cooler.type === 'aio' ? 'AIO Pump 2400rpm' : 'CPU Fan 1200rpm'}`, 50) + ' OK',
    pad(`Power  : ${B.psu.w}W  (Load ${totalW()}W)`, 50) + ' OK', '',
    'All devices detected.  Booting...'
  ];
  sfx.beep();
  for (const l of lines) { boot.textContent += l + '\n'; await tween(260, () => {}); }
  await tween(900, () => {});
  boot.style.display = 'none';
  $('#fSpec').innerHTML = [['ケース', B.case.name], ['マザボ', B.mb.name], ['CPU', B.cpu.brand + ' ' + B.cpu.model], ['SSD', B.m2.cap],
    ['メモリ', B.ram.name], ['クーラー', B.cooler.name], ['グラボ', B.gpu.name], ['電源', B.psu.w + 'W ' + B.psu.grade]]
    .map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  $('#finish').style.display = 'flex';
  $('#install').textContent = '起動しました';
  $('#stepTitle').textContent = '起動成功！';
  $('#stepDesc').textContent = 'ファンが回り、LEDが光っています。画面をドラッグして、完成したPCを自由に眺めてみましょう。';
  focus([CL().xc, 2, 0, 86]);
}
$('#install').onclick = attempt;
$('#again').onclick = () => location.reload();
$('#look').onclick = () => { $('#finish').style.display = 'none'; controls.autoRotate = true; controls.autoRotateSpeed = .8; };

/* ================= picking / hover ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e, objs) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(objs.filter(Boolean), true)[0];
}
/* ================= wiring (player drags plugs) ================= */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const CABLES = [
  { id: 'atx24', name: '24ピン電源ケーブル', use: 'マザーボード全体に給電', r: .55, sw: '#3a3f47' },
  { id: 'eps8', name: 'CPU 8ピン (EPS)', use: 'CPUに給電', r: .34, sw: '#4a6a8a' },
  { id: 'pcie8', name: 'PCIe 8ピン', use: 'グラボに給電', r: .34, sw: '#8a6a3a' }
];
const SOCKETS = [
  { id: 'atx24', label: 'マザーボードの24ピン' },
  { id: 'eps8', label: 'マザーボード左上のCPU用8ピン' },
  { id: 'pcie8', label: 'グラボの8ピン' }
];
function wireDefs() {
  const cx = -20 + B.gpu.len - 3, L = CL();
  const fx = Math.min(8.5, L.frontIn - 2.4 - (B.cooler.type === 'aio' ? 2.7 : 0) - 1.6);
  const py = Math.max(-8, L.shroudTop + 1.6);
  return {
    atx24: { anchor: V3(6.2, 10, -10.8), rest: V3(fx, 6, 1), target: V3(4.45, 10, -8.9), dir: V3(-1, 0, 0),
      plug: [1.6, 5, 1.4], sock: { pos: V3(3.2, 10, -8.9), size: [1.6, 5.8, 1.9] } },
    eps8: { anchor: V3(-15.8, 21.8, -10.8), rest: V3(-12, 21.6, 1), target: V3(-17, 20.8, -9), dir: V3(0, -1, 0),
      plug: [2.4, 1.2, 1.3], sock: { pos: V3(-17, 19.6, -9), size: [3, 1.6, 1.7] } },
    pcie8: { anchor: V3(6.2, -4.3, -10.8), rest: V3(fx, py, 4), target: V3(cx, 2.25, .3), dir: V3(0, -1, 0),
      plug: [2.4, 1.2, 1.3], sock: { pos: V3(cx, 1.15, .3), size: [3, 1.4, 1.8] } }
  };
}
let wires = {}, wireSel = null, wireGroup = null, drag = null, hoverSock = null;
const sockMat = id => new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: .35, depthWrite: false });
function cableCurve(w) {
  const d = w.def, rear = w.pos.clone().addScaledVector(d.dir, -d.plug[2] / 2);
  return new THREE.CubicBezierCurve3(d.anchor, d.anchor.clone().add(V3(0, 0, 3.2)), rear.clone().addScaledVector(d.dir, -3.5), rear);
}
function updateWire(w) {
  if (w.tube.geometry) w.tube.geometry.dispose();
  w.tube.geometry = new THREE.TubeGeometry(cableCurve(w), 72, w.cable.r, 12, false);
  w.plug.position.copy(w.pos);
}
function setupWires() {
  if (wireGroup) pc.remove(wireGroup);
  wireGroup = new THREE.Group(); pc.add(wireGroup);
  const defs = wireDefs(); wires = {};
  CABLES.forEach(cb => {
    const d = defs[cb.id];
    const tube = new THREE.Mesh(new THREE.BufferGeometry(), mat(0xffffff, .65, .1, { map: sleeveTex(14) }));
    tube.castShadow = true;
    const pm = mat(0x111214, .6, .1, { emissive: 0x000000 });
    const plug = rbox(...d.plug, pm, 0, 0, 0, null, .12);
    plug.up.set(0, 0, 1); plug.lookAt(d.dir.clone()); plug.userData.cable = cb.id; plug.castShadow = true;
    const latch = box(d.plug[0] * .4, .25, .3, pm, 0, d.plug[1] / 2 + .1, 0, plug); latch.userData.cable = cb.id;
    const sm = sockMat(); const sock = rbox(...d.sock.size, sm, d.sock.pos.x, d.sock.pos.y, d.sock.pos.z, null, .15);
    sock.userData.sock = cb.id;
    wireGroup.add(tube, plug, sock);
    wires[cb.id] = { cable: cb, def: d, tube, plug, sock, sm, pm, pos: d.rest.clone(), done: false };
    updateWire(wires[cb.id]);
  });
  selectWire('atx24');
}
function selectWire(id) {
  wireSel = id; if (steps[idx].type === 'wire') renderStep();
}
function renderWires(list) {
  const lab = document.createElement('div'); lab.className = 'optLabel';
  lab.textContent = 'つなぐケーブルを選ぶ'; list.appendChild(lab);
  CABLES.forEach(cb => {
    const w = wires[cb.id]; if (!w) return;
    const b = document.createElement('button');
    b.className = 'opt cab' + (w.done ? ' done' : '') + (wireSel === cb.id && !w.done ? ' sel' : '');
    b.innerHTML = `<span class="sw" style="background:${cb.sw}"></span><div><div class="n"></div><div class="s"></div></div><span class="st">${w.done ? '接続済み' : '未接続'}</span>`;
    b.querySelector('.n').textContent = cb.name; b.querySelector('.s').textContent = cb.use;
    if (!w.done) b.onclick = () => { sfx.pick(); selectWire(cb.id); };
    list.appendChild(b);
  });
}
function toScreen(v) {
  const p = v.clone(); pc.localToWorld(p); p.project(camera);
  const r = canvas.getBoundingClientRect();
  return { x: (p.x + 1) / 2 * r.width + r.left, y: (1 - p.y) / 2 * r.height + r.top };
}
function nearestSock(e, maxPx) {
  let best = null, bd = maxPx;
  Object.values(wires).forEach(w => {
    if (w.done) return;
    const s = toScreen(w.def.sock.pos), d = Math.hypot(s.x - e.clientX, s.y - e.clientY);
    if (d < bd) { bd = d; best = w; }
  });
  return best;
}
function wireDown(e) {
  if (!steps[idx] || steps[idx].type !== 'wire' || busy) return false;
  const plugs = Object.values(wires).filter(w => !w.done).map(w => w.plug);
  const h = pick(e, plugs); if (!h) return false;
  let o = h.object; while (o && !o.userData.cable) o = o.parent;
  const w = wires[o.userData.cable];
  if (wireSel !== w.cable.id) selectWire(w.cable.id);
  const n = camera.getWorldDirection(V3(0, 0, 0)).negate();
  drag = { w, plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n, w.pos.clone()) };
  controls.enabled = false; canvas.style.cursor = 'grabbing'; sfx.pick();
  return true;
}
function wireMove(e) {
  const r = canvas.getBoundingClientRect(), hit = V3(0, 0, 0);
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(drag.plane, hit)) { drag.w.pos.copy(hit); updateWire(drag.w); }
  hoverSock = nearestSock(e, 70);
}
async function wireUp(e) {
  const w = drag.w; drag = null; controls.enabled = true; canvas.style.cursor = 'grab';
  const s = nearestSock(e, 60); hoverSock = null;
  const from = w.pos.clone();
  busy = true;
  if (s && s === w) {
    await tween(320, k => { w.pos.lerpVectors(from, w.def.target, k); updateWire(w); });
    w.done = true; w.sock.visible = false; w.pm.emissive.set(0); sfx.click();
    named(w.plug, w.cable.name); installed.push(w.plug, w.tube); w.tube.userData.name = w.cable.name;
    toast('「' + w.cable.name + '」をつなぎました', 'ok');
    const left = CABLES.find(c => !wires[c.id].done);
    busy = false;
    if (left) selectWire(left.id); else { renderStep(); setTimeout(() => { toast('3本ともつながりました！', 'ok'); next(); }, 900); }
    return;
  }
  if (s) {
    sfx.err();
    const sock = SOCKETS.find(x => x.id === s.cable.id);
    const why = w.cable.id === 'atx24' || s.cable.id === 'atx24' ? `「${w.cable.name}」とはピンの数が違います。` : 'CPU用（EPS）とグラボ用（PCIe）の8ピンは、ツメと穴の形が違うので挿さりません。';
    toast(`形が合いません。ここは「${sock.label}」の差し込み口です。${why}`, 'error');
  }
  await tween(450, k => { w.pos.lerpVectors(from, w.def.rest, k); updateWire(w); });
  busy = false;
}
function wireTick(now) {
  Object.values(wires).forEach(w => {
    if (w.done) return;
    const pulse = .5 + .5 * Math.sin(now / 260);
    if (hoverSock === w && drag) w.sm.color.set(drag.w === w ? 0x7bf1a8 : 0xff6b6b);
    else if (drag && hoverSock && hoverSock !== w) w.sm.color.set(0x4cc9f0);
    else w.sm.color.set(0x4cc9f0);
    w.sm.opacity = .2 + .25 * pulse;
    w.pm.emissive.setRGB(0, 0, 0);
    if (wireSel === w.cable.id && !(drag && drag.w === w)) w.pm.emissive.setRGB(.05 + .25 * pulse, .25 + .5 * pulse, .35 + .6 * pulse);
  });
}

function targets() { return steps[idx] && steps[idx].type === 'power' ? [ghost, powerBtn] : [staging, ghost]; }
let down = null;
canvas.addEventListener('pointerdown', e => {
  controls.autoRotate = false;
  if (wireDown(e)) { canvas.setPointerCapture(e.pointerId); down = null; return; }
  down = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', e => {
  if (drag) { wireUp(e); return; }
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved < 6 && !finished && pick(e, targets())) attempt();
});
const tip = $('#tooltip');
canvas.addEventListener('pointermove', e => {
  if (drag) { tip.style.display = 'none'; wireMove(e); return; }
  if (e.buttons) { tip.style.display = 'none'; return; }
  if (steps[idx] && steps[idx].type === 'wire' && !finished) {
    const h = pick(e, Object.values(wires).filter(w => !w.done).map(w => w.plug));
    if (h) { canvas.style.cursor = 'grab'; let o = h.object; while (o && !o.userData.cable) o = o.parent;
      const r = view.getBoundingClientRect(); tip.textContent = wires[o.userData.cable].cable.name + '（ドラッグでつなぐ）';
      tip.style.display = 'block'; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; return; }
  }
  const over = !finished && pick(e, targets());
  canvas.style.cursor = over ? 'pointer' : 'grab';
  let name = null;
  if (!over) {
    const h = pick(e, installed.concat(caseG ? [caseG] : []));
    if (h) { let o = h.object; while (o && !o.userData.name) o = o.parent; name = o && o.userData.name; }
  } else name = steps[idx].type === 'power' ? '電源ボタン' : 'クリックで取り付け';
  if (name) {
    const r = view.getBoundingClientRect();
    tip.textContent = name; tip.style.display = 'block';
    tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerleave', () => tip.style.display = 'none');

/* ================= loop ================= */
let last = performance.now();
const tmpC = new THREE.Color();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  runTweens(now);
  if (staging && !busy) {
    const b = staging.userData.base, o = staging.userData.off;
    staging.position.set(b.x + o.x, b.y + o.y + Math.sin(now / 420) * .4, b.z + o.z);
  }
  ghostMat.opacity = .16 + .16 * (.5 + .5 * Math.sin(now / 260));
  wireTick(now);
  fanSpeed += (fanTarget - fanSpeed) * dt * .9;
  rotors.forEach(r => r.rotation.z += fanSpeed * dt * 22);
  if (fanTarget > 0) {
    ledLevel += (1 - ledLevel) * dt * 1.2;
    leds.forEach(({ m, h, i }) => {
      tmpC.setHSL((now / 5000 + i * .06) % 1, 1, .5);
      m.emissive.copy(tmpC).multiplyScalar(1.6 * ledLevel);
      if (h) { h.color.copy(tmpC); h.opacity = .22 * ledLevel; }
    });
    rgbLights.forEach((l, i) => { l.color.setHSL((now / 5000 + i * .2) % 1, 1, .55); l.intensity = 1.4 * ledLevel; });
    powerRing.material.emissive.setRGB(.4 * ledLevel, 1 * ledLevel, 1.4 * ledLevel);
    if (powerRing.userData.halo) { powerRing.userData.halo.color.setRGB(.3, .8, 1); powerRing.userData.halo.opacity = .3 * ledLevel; }
  }
  controls.update();
  renderer.render(scene, camera);
}
resize();
setCase(CASES[0]);
setupStep();
requestAnimationFrame(loop);
window.__pcbuild = { attempt, choose, setGlass, B, wires: () => wires, toScreen, get idx() { return idx; } };
})();
</script>
